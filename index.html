<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sridurga | Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #e3f2fd;
            --card-bg: #ffffff;
            --text-color: #1565c0;
            --text-secondary: #555555;
            --accent-color: #2196f3;
            --shadow-color: rgba(33, 150, 243, 0.15);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* --- Toast / Modal Styles --- */
        #toast-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(21, 101, 192, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
            box-sizing: border-box;
        }

        .toast-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px; /* Slightly wider to accommodate the longer sentence */
            padding: 60px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(21, 101, 192, 0.25);
            position: relative;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-sizing: border-box;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast-card h2 {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 2.2rem; /* Slightly smaller size because the sentence is long */
            font-weight: 600; /* Reduced thickness to match your cards */
            margin: 0;
            color: var(--text-color);
            letter-spacing: -0.5px; /* Less tight spacing looks cleaner */
            line-height: 1.3;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 32px;
            font-weight: 300;
            cursor: pointer;
            color: #aaa;
            line-height: 1;
            transition: color 0.2s, transform 0.2s;
            user-select: none;
        }

        .close-btn:hover {
            color: var(--text-color);
            transform: scale(1.1);
        }

        /* Mobile specific font scaling */
        @media (max-width: 480px) {
            .toast-card h2 {
                font-size: 1.6rem;
            }
            .toast-card {
                padding: 50px 25px;
            }
        }

        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        /* --- End Toast Styles --- */

        h1 {
            font-family: 'IM Fell English', serif;
            font-weight: 400;
            font-size: 3.5rem;
            margin-bottom: 40px;
            text-align: center;
            color: var(--text-color);
            text-shadow: 2px 2px 0px rgba(174, 213, 243, 0.5);
        }

        .project-grid {
            display: grid;
            width: 100%;
            max-width: 800px;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            color: var(--text-secondary);
            box-shadow: 0 4px 15px var(--shadow-color);
            border: 1px solid transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(33, 150, 243, 0.3);
            border-color: var(--accent-color);
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-color);
        }

        .footer {
            margin-top: auto;
            padding: 20px;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .footer a { color: var(--accent-color); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Toast Component -->
    <div id="toast-overlay">
        <div class="toast-card">
            <span class="close-btn" onclick="closeToast()">&times;</span>
            <h2 id="toast-text">Loading...</h2>
        </div>
    </div>

    <h1>Sri's Stuff</h1>

    <div class="project-grid">
        <a href="https://geogle.storm-fyre.workers.dev/" class="card" target="_blank">
            <div class="card-title">Geogle</div>
        </a>
        <a href="https://storm-fyre.github.io/silversolver/" class="card" target="_blank">
            <div class="card-title">Silver Solver</div>
        </a>
    </div>

    <div class="footer">
        Contact: <a href="mailto:rakshann.t@gmail.com">rakshann.t@gmail.com</a>
    </div>

    <script>
        // If you change this string, the toast shows again for everyone.
        const toastMessage = "You better start recording those songs. Dec 31 is just a stone's throw away";

        const overlay = document.getElementById('toast-overlay');
        const toastHeading = document.getElementById('toast-text');

        window.onload = function() {
            const lastSeenContent = localStorage.getItem('lastToastContent');

            if (lastSeenContent !== toastMessage) {
                toastHeading.textContent = toastMessage;
                overlay.style.display = 'flex';
                document.body.style.overflow = 'hidden';
            }
        };

        function closeToast() {
            overlay.style.display = 'none';
            document.body.style.overflow = 'auto';
            localStorage.setItem('lastToastContent', toastMessage);
        }
    </script>

</body>
</html>
