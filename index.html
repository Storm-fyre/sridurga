<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sridurga | Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Base Theme Colors (Defaults to Original Pink) */
            --text-color: #5c3a4d;
            --text-secondary: #7a5c6b;
            --accent-color: #f08a9d;
            --card-bg: rgba(255, 255, 255, 0.65);
            --border-color: rgba(255, 255, 255, 0.8);
            --shadow-color: rgba(240, 138, 157, 0.2);

            /* Dynamic Background Gradient Variables */
            --bg-grad-1: #fce4ec;
            --bg-grad-2: #f8bbd0;
            --bg-grad-3: #ffeff1;
            --bg-grad-4: #fff3e0;

            /* Dynamic Petal Variables */
            --petal-color: #ffb7c5;
            --petal-shadow: rgba(255, 183, 197, 0.5);
        }

        /* --- Living Sunset Background --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
            background: linear-gradient(-45deg, var(--bg-grad-1), var(--bg-grad-2), var(--bg-grad-3), var(--bg-grad-4));
            background-size: 400% 400%;
            animation: breathe 15s ease infinite;
            overflow-x: hidden;
            transition: color 1.5s ease;
        }

        @keyframes breathe {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- Toast / Modal Styles --- */
        #toast-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
            box-sizing: border-box;
        }

        .toast-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            padding: 60px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px var(--shadow-color);
            position: relative;
            text-align: center;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transition: box-shadow 1.5s ease, background 1.5s ease, border-color 1.5s ease;
        }

        .toast-card h2 {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 1.8rem;
            font-weight: 600;
            margin: 0;
            color: var(--text-color);
            letter-spacing: -0.5px;
            line-height: 1.4;
            transition: color 1.5s ease;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 32px;
            font-weight: 300;
            cursor: pointer;
            color: var(--text-secondary);
            line-height: 1;
            transition: color 0.2s, transform 0.2s;
            user-select: none;
        }

        .close-btn:hover {
            color: var(--accent-color);
            transform: scale(1.1);
        }

        /* --- Color Input Bar Styles --- */
        #color-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9998;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .color-bar {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            border-radius: 50px;
            display: flex;
            align-items: center;
            padding: 10px 20px;
            width: 90%;
            max-width: 420px;
            transform: translateY(20px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 1.5s ease, border-color 1.5s ease;
            position: relative;
        }

        .color-bar input {
            flex-grow: 1;
            background: transparent;
            border: none;
            outline: none;
            font-size: 1.1rem;
            color: var(--text-color);
            font-family: 'Segoe UI', sans-serif;
            padding: 10px;
        }

        .color-bar input::placeholder {
            color: var(--text-secondary);
            opacity: 0.6;
            font-size: 1rem;
            transition: color 1.5s ease;
        }

        .color-go-btn {
            background: var(--text-color);
            color: var(--card-bg); /* Use card-bg color to always contrast text properly */
            border: none;
            border-radius: 30px;
            padding: 8px 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, background 1.5s ease, color 1.5s ease;
        }

        .color-go-btn:hover {
            transform: scale(1.05);
        }

        .color-close-btn {
            position: absolute;
            top: -40px;
            right: 10px;
            font-size: 24px;
            color: var(--text-color);
            cursor: pointer;
            font-weight: bold;
            transition: color 1.5s ease;
        }

        /* Polite Error Popup & Suggestions */
        .color-error-msg {
            position: absolute;
            bottom: -45px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--card-bg);
            color: var(--text-color);
            padding: 8px 18px;
            border-radius: 15px;
            font-size: 0.95rem;
            font-weight: 500;
            box-shadow: 0 5px 15px var(--shadow-color);
            border: 1px solid var(--border-color);
            opacity: 0;
            pointer-events: none; /* Changed dynamically in JS */
            transition: opacity 0.3s ease, background 1.5s ease, border-color 1.5s ease;
            white-space: nowrap;
        }

        .suggestion-link {
            font-weight: 700;
            color: var(--accent-color);
            cursor: pointer;
            text-decoration: underline;
            text-decoration-thickness: 2px;
            text-underline-offset: 3px;
            transition: color 0.2s ease;
        }

        .suggestion-link:hover {
            opacity: 0.7;
        }

        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* --- Main Content --- */
        h1 {
            font-family: 'IM Fell English', serif;
            font-weight: 400;
            font-size: 3.5rem;
            margin-bottom: 40px;
            text-align: center;
            color: var(--text-color);
            position: relative;
            z-index: 10;
            transition: color 1.5s ease;
        }

        .project-grid {
            display: grid;
            width: 100%;
            max-width: 800px;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            position: relative;
            z-index: 10;
        }

        .card {
            background-color: var(--card-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.4s ease, box-shadow 0.4s ease, border-color 1.5s ease, background-color 1.5s ease;
            text-decoration: none;
            color: var(--text-secondary);
            box-shadow: 0 8px 20px var(--shadow-color);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px 20px;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px var(--shadow-color);
            border-color: var(--accent-color);
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-color);
            transition: color 1.5s ease;
        }

        .footer {
            margin-top: auto;
            padding: 30px 20px 25px;
            text-align: center;
            font-size: 1rem;
            color: var(--text-secondary);
            font-style: italic;
            position: relative;
            z-index: 10;
            transition: color 1.5s ease;
        }

        /* --- Cherry Blossom Secret Styles --- */
        #blossom-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            top: -10%;
            background-color: var(--petal-color);
            border-radius: 15px 0 15px 0;
            opacity: 0.8;
            box-shadow: 0 0 5px var(--petal-shadow);
            animation: fall linear forwards;
            transition: background-color 1.5s ease, box-shadow 1.5s ease;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg) translateX(0); }
            100% { transform: translateY(110vh) rotate(720deg) translateX(50px); }
        }
    </style>
</head>
<body>

    <!-- Greeting Toast Component -->
    <div id="toast-overlay">
        <div class="toast-card">
            <span class="close-btn" onclick="closeToast()">&times;</span>
            <h2 id="toast-text">Loading...</h2>
        </div>
    </div>

    <!-- The Secret Color Bar -->
    <div id="color-overlay">
        <div class="color-bar" id="color-bar">
            <span class="color-close-btn" onclick="closeColorBar()">&times;</span>
            <input type="text" id="color-input" placeholder="Type a colour name or Hex color code" autocomplete="off">
            <button class="color-go-btn" onclick="applyColorTheme()">Go</button>
            <div id="color-error-msg" class="color-error-msg">I don't know that colour! Try another?</div>
        </div>
    </div>

    <!-- Container for secret cherry blossoms -->
    <div id="blossom-container"></div>

    <h1>Sri's Stuff</h1>

    <div class="project-grid">
        <a href="https://geogle.storm-fyre.workers.dev/" class="card" target="_blank">
            <div class="card-title">Geogle</div>
        </a>
        <a href="https://storm-fyre.github.io/silversolver/" class="card" target="_blank">
            <div class="card-title">Silver Solver</div>
        </a>
        <a href="https://storm-fyre.github.io/export-tradle/" class="card" target="_blank">
            <div class="card-title">Stromfyre's Tradle</div>
        </a>
        <a href="https://storm-fyre.github.io/drawfast/" class="card" target="_blank">
            <div class="card-title">Drawfast</div>
        </a>
    </div>

    <div class="footer">
        Just a little corner of the web for you.
    </div>

    <!-- Load our massive dictionary file! -->
    <script src="colors.js"></script>

    <script>
        // --- 1. The Rotating Uplifts ---
        const uplifts =[
            "Hope you're having a beautiful day, Sri.",
            "Remember to take a break and hydrate!",
            "Just a little reminder that you're doing great.",
            "Your projects are looking amazing as always.",
            "Wishing you a day as wonderful as you are."
        ];

        const overlay = document.getElementById('toast-overlay');
        const toastHeading = document.getElementById('toast-text');

        window.onload = function() {
            if (!sessionStorage.getItem('hasSeenGreeting')) {
                const randomMessage = uplifts[Math.floor(Math.random() * uplifts.length)];
                toastHeading.textContent = randomMessage;
                overlay.style.display = 'flex';
                document.body.style.overflow = 'hidden';
            }
        };

        function closeToast() {
            overlay.style.display = 'none';
            document.body.style.overflow = 'auto';
            sessionStorage.setItem('hasSeenGreeting', 'true');
        }

        // --- 2. The "Come Back Soon?" Tab Trick ---
        let originalTitle = document.title;
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                document.title = "Come back soon? :)";
            } else {
                document.title = originalTitle;
            }
        });

        // --- 3. Secret Code & Colour Trigger Logic ---
        let keysPressed = '';
        const secretCode = 'silverisridurga';
        const colorTriggers =['colour', 'color'];

        window.addEventListener('keydown', (e) => {
            if (document.getElementById('color-overlay').style.display === 'flex') return;

            if (e.key.length === 1) {
                keysPressed += e.key.toLowerCase();
            }
            
            if (keysPressed.length > 15) {
                keysPressed = keysPressed.slice(-15);
            }

            if (keysPressed === secretCode) {
                triggerBlossoms();
                keysPressed = ''; 
            } 
            else if (keysPressed.endsWith(colorTriggers[0]) || keysPressed.endsWith(colorTriggers[1])) {
                openColorBar();
                keysPressed = '';
            }
        });

        // --- 4. Petal System ---
        function triggerBlossoms() {
            const container = document.getElementById('blossom-container');
            for(let i = 0; i < 40; i++) {
                setTimeout(() => {
                    const petal = document.createElement('div');
                    petal.classList.add('petal');
                    
                    const size = Math.random() * 12 + 10; 
                    petal.style.width = `${size}px`;
                    petal.style.height = `${size}px`;
                    petal.style.left = `${Math.random() * 100}vw`;
                    petal.style.animationDuration = `${Math.random() * 3 + 4}s`; 
                    
                    container.appendChild(petal);
                    setTimeout(() => { petal.remove(); }, 8000); 
                }, i * 150);
            }
        }

        // --- 5. Dynamic Colour Theming System ---
        const colorOverlay = document.getElementById('color-overlay');
        const colorBar = document.getElementById('color-bar');
        const colorInput = document.getElementById('color-input');
        const errorMsg = document.getElementById('color-error-msg');
        let errorTimeout;

        function openColorBar() {
            colorOverlay.style.display = 'flex';
            setTimeout(() => {
                colorOverlay.style.opacity = '1';
                colorBar.style.transform = 'translateY(0)';
                colorInput.value = '';
                errorMsg.style.opacity = '0'; 
                errorMsg.style.pointerEvents = 'none';
                colorInput.focus();
            }, 10);
        }

        function closeColorBar() {
            colorOverlay.style.opacity = '0';
            colorBar.style.transform = 'translateY(20px)';
            setTimeout(() => {
                colorOverlay.style.display = 'none';
            }, 400);
        }

        // Hide error immediately if they start typing again
        colorInput.addEventListener('input', () => {
            errorMsg.style.opacity = '0';
            errorMsg.style.pointerEvents = 'none';
        });

        // Smart Polite Error Function (Now accepts custom messages like "Please enter...")
        function showPoliteError(suggestion = null, customMsg = null) {
            colorInput.select(); 
            
            if (suggestion) {
                // Spellchecker Suggestion Flow
                errorMsg.innerHTML = `Did you mean '<span class="suggestion-link" onclick="applySuggestion('${suggestion}')">${suggestion}</span>'?`;
                errorMsg.style.pointerEvents = 'auto'; 
                
                if(errorTimeout) clearTimeout(errorTimeout);
                errorTimeout = setTimeout(() => {
                    errorMsg.style.opacity = '0';
                    errorMsg.style.pointerEvents = 'none';
                }, 5000);
            } else {
                // Standard Error / Custom Message Flow
                errorMsg.innerHTML = customMsg ? customMsg : "I don't know that colour! Try another?";
                errorMsg.style.pointerEvents = 'none';
                
                if(errorTimeout) clearTimeout(errorTimeout);
                errorTimeout = setTimeout(() => {
                    errorMsg.style.opacity = '0';
                }, 2000);
            }

            errorMsg.style.opacity = '1';
        }

        // Called when the user clicks the suggestion span
        function applySuggestion(suggestion) {
            colorInput.value = suggestion;
            applyColorTheme();
        }

        colorInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') applyColorTheme();
        });

        // --- Levenshtein Distance Algorithm (Spell Checker) ---
        function getLevenshteinDistance(a, b) {
            const matrix =[];
            for (let i = 0; i <= b.length; i++) {
                matrix[i] = [i];
            }
            for (let j = 0; j <= a.length; j++) {
                matrix[0][j] = j;
            }
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    if (b.charAt(i - 1) === a.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(
                            matrix[i - 1][j - 1] + 1, // substitution
                            matrix[i][j - 1] + 1,     // insertion
                            matrix[i - 1][j] + 1      // deletion
                        );
                    }
                }
            }
            return matrix[b.length][a.length];
        }

        // Scans dictionary to find the closest match within 2 edits
        function findNearestColor(inputStr) {
            let query = inputStr.trim().toLowerCase().replace(/\s+/g, '');
            let bestMatch = null;
            let minDistance = 3; // Threshold: max 2 edits allowed
            
            const standardColors =['red', 'blue', 'green', 'yellow', 'purple', 'orange', 'pink', 'brown', 'black', 'white', 'gray', 'grey', 'cyan', 'magenta', 'crimson', 'fuchsia', 'silver'];
            
            let colorKeys = standardColors;
            if (window.extendedColors) {
                colorKeys = [...new Set([...standardColors, ...Object.keys(window.extendedColors)])];
            }

            for (let color of colorKeys) {
                let dist = getLevenshteinDistance(query, color);
                if (dist < minDistance) {
                    minDistance = dist;
                    bestMatch = color;
                }
            }
            return bestMatch;
        }

        // Evaluates Hex -> Custom Dictionary -> Standard CSS
        function resolveColorToRGB(inputStr) {
            let query = inputStr.trim().toLowerCase().replace(/\s+/g, ''); 
            if (!query) return null;

            if (/^#?[0-9a-f]{3,8}$/.test(query)) {
                if (!query.startsWith('#')) query = '#' + query;
                return getRGBFromColorString(query); 
            }

            if (window.extendedColors && window.extendedColors[query]) {
                return getRGBFromColorString(window.extendedColors[query]);
            }

            return getRGBFromColorString(inputStr); 
        }

        function getRGBFromColorString(colorStr) {
            const temp = document.createElement('div');
            temp.style.display = 'none';
            document.body.appendChild(temp);
            
            temp.style.color = 'rgb(1, 2, 3)'; 
            temp.style.color = colorStr;  
            
            const computedColor = window.getComputedStyle(temp).color;
            document.body.removeChild(temp);
            
            if (computedColor === 'rgb(1, 2, 3)' && colorStr.replace(/\s/g, '') !== 'rgb(1,2,3)') {
                return null;
            }
            
            const match = computedColor.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
            if(!match) return null; 
            return [parseInt(match[1]), parseInt(match[2]), parseInt(match[3])];
        }

        function rgbToHsl(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            let max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;

            if(max === min) { h = s = 0; } 
            else {
                let d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch(max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            return [h * 360, s * 100, l * 100];
        }

        function applyColorTheme() {
            let inputColor = colorInput.value;
            
            // 1. EMPTY INPUT CHECK
            if (inputColor.trim() === '') {
                return showPoliteError(null, "Please enter the colour");
            }

            const rgb = resolveColorToRGB(inputColor);
            
            if(!rgb) {
                const suggestion = findNearestColor(inputColor);
                return showPoliteError(suggestion);
            }

            errorMsg.style.opacity = '0';
            errorMsg.style.pointerEvents = 'none';

            let [h, s, l] = rgbToHsl(rgb[0], rgb[1], rgb[2]);
            const root = document.documentElement;

            // 2. DARK MODE CALCULATION (If color is dark, flip the UI!)
            const isDark = l < 50; 
            
            // Text adjusts to be readable against dark or light background
            root.style.setProperty('--text-color', `hsl(${h}, ${s}%, ${isDark ? 95 : 20}%)`);
            root.style.setProperty('--text-secondary', `hsl(${h}, ${s}%, ${isDark ? 75 : 35}%)`);
            root.style.setProperty('--accent-color', `hsl(${h}, ${s}%, ${isDark ? 70 : 65}%)`);
            
            // Shadow gets darker in dark mode
            root.style.setProperty('--shadow-color', `hsla(${h}, ${s}%, ${isDark ? 5 : 60}%, ${isDark ? 0.6 : 0.3})`);
            
            // Background gradients invert their lightness
            root.style.setProperty('--bg-grad-1', `hsl(${h}, ${s}%, ${isDark ? 15 : 94}%)`);
            root.style.setProperty('--bg-grad-2', `hsl(${h}, ${s}%, ${isDark ? 10 : 88}%)`);
            root.style.setProperty('--bg-grad-3', `hsl(${h}, ${s}%, ${isDark ? 18 : 96}%)`);
            root.style.setProperty('--bg-grad-4', `hsl(${h}, ${s}%, ${isDark ? 12 : 91}%)`);
            
            // Cards switch from frosted white to frosted dark-tint
            root.style.setProperty('--card-bg', `hsla(${h}, ${s}%, ${isDark ? 20 : 100}%, 0.65)`);
            root.style.setProperty('--border-color', `hsla(${h}, ${s}%, ${isDark ? 30 : 100}%, 0.5)`);

            // Petals dynamically switch shade
            root.style.setProperty('--petal-color', `hsl(${h}, ${s}%, ${isDark ? 30 : 82}%)`);
            root.style.setProperty('--petal-shadow', `hsla(${h}, ${s}%, ${isDark ? 30 : 82}%, 0.5)`);

            closeColorBar();
            
            setTimeout(() => { triggerBlossoms(); }, 150);
        }
    </script>
</body>
</html>
