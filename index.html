<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sridurga | Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap" rel="stylesheet">
    <style>
        /* Modern CSS properties for smooth, dreamy background transitions */
        @property --bg-1 { syntax: '<color>'; inherits: false; initial-value: #fce4ec; }
        @property --bg-2 { syntax: '<color>'; inherits: false; initial-value: #f8bbd0; }
        @property --bg-3 { syntax: '<color>'; inherits: false; initial-value: #ffeff1; }
        @property --bg-4 { syntax: '<color>'; inherits: false; initial-value: #fff3e0; }
        @property --text-color { syntax: '<color>'; inherits: true; initial-value: #5c3a4d; }
        @property --text-secondary { syntax: '<color>'; inherits: true; initial-value: #7a5c6b; }
        @property --accent-color { syntax: '<color>'; inherits: true; initial-value: #f08a9d; }
        @property --shadow-color { syntax: '<color>'; inherits: true; initial-value: rgba(240, 138, 157, 0.2); }

        :root {
            --bg-1: #fce4ec;
            --bg-2: #f8bbd0;
            --bg-3: #ffeff1;
            --bg-4: #fff3e0;
            
            --text-color: #5c3a4d;
            --text-secondary: #7a5c6b;
            --accent-color: #f08a9d;
            
            --card-bg: rgba(255, 255, 255, 0.65);
            --shadow-color: rgba(240, 138, 157, 0.2);
        }

        /* --- Living Sunset Background --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
            background: linear-gradient(-45deg, var(--bg-1), var(--bg-2), var(--bg-3), var(--bg-4));
            background-size: 400% 400%;
            animation: breathe 15s ease infinite;
            overflow-x: hidden;
            
            /* The magic 2-second fade when a new color is typed */
            transition: 
                --bg-1 2s ease, --bg-2 2s ease, --bg-3 2s ease, --bg-4 2s ease,
                --text-color 2s ease, --text-secondary 2s ease, 
                --accent-color 2s ease, --shadow-color 2s ease;
        }

        @keyframes breathe {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- Toast / Modal Styles --- */
        #toast-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
            box-sizing: border-box;
        }

        .toast-card {
            background: rgba(255, 255, 255, 0.85);
            width: 100%;
            max-width: 500px;
            padding: 60px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px var(--shadow-color);
            position: relative;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-sizing: border-box;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast-card h2 {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 1.8rem;
            font-weight: 600;
            margin: 0;
            color: var(--text-color);
            letter-spacing: -0.5px;
            line-height: 1.4;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 32px;
            font-weight: 300;
            cursor: pointer;
            color: var(--text-secondary);
            line-height: 1;
            transition: color 0.2s, transform 0.2s;
            user-select: none;
        }

        .close-btn:hover {
            color: var(--accent-color);
            transform: scale(1.1);
        }

        @media (max-width: 480px) {
            .toast-card h2 { font-size: 1.5rem; }
            .toast-card { padding: 50px 25px; }
        }

        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* --- Main Content --- */
        h1 {
            font-family: 'IM Fell English', serif;
            font-weight: 400;
            font-size: 3.5rem;
            margin-bottom: 40px;
            text-align: center;
            color: var(--text-color);
            text-shadow: 2px 2px 0px rgba(255, 255, 255, 0.6);
            position: relative;
            z-index: 10;
        }

        .project-grid {
            display: grid;
            width: 100%;
            max-width: 800px;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            position: relative;
            z-index: 10;
        }

        .card {
            background-color: var(--card-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.4s ease, box-shadow 0.4s ease, border-color 0.4s ease;
            text-decoration: none;
            color: var(--text-secondary);
            box-shadow: 0 8px 20px var(--shadow-color);
            border: 1px solid rgba(255, 255, 255, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px 20px;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px var(--shadow-color);
            border-color: var(--accent-color);
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-color);
            transition: color 2s ease;
        }

        .footer {
            margin-top: auto;
            padding: 30px 20px 25px;
            text-align: center;
            font-size: 1rem;
            color: var(--text-secondary);
            font-style: italic;
            position: relative;
            z-index: 10;
        }

        /* --- Cherry Blossom Secret Styles --- */
        #blossom-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            top: -10%;
            border-radius: 15px 0 15px 0;
            opacity: 0.8;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg) translateX(0); }
            100% { transform: translateY(110vh) rotate(720deg) translateX(50px); }
        }
    </style>
</head>
<body>

    <!-- Toast Component -->
    <div id="toast-overlay">
        <div class="toast-card">
            <span class="close-btn" onclick="closeToast()">&times;</span>
            <h2 id="toast-text">Loading...</h2>
        </div>
    </div>

    <!-- Container for secret cherry blossoms -->
    <div id="blossom-container"></div>

    <h1>Sri's Stuff</h1>

    <div class="project-grid">
        <a href="https://geogle.storm-fyre.workers.dev/" class="card" target="_blank">
            <div class="card-title">Geogle</div>
        </a>
        <a href="https://storm-fyre.github.io/silversolver/" class="card" target="_blank">
            <div class="card-title">Silver Solver</div>
        </a>
        <a href="https://storm-fyre.github.io/export-tradle/" class="card" target="_blank">
            <div class="card-title">Stromfyre's Tradle</div>
        </a>
        <a href="https://storm-fyre.github.io/drawfast/" class="card" target="_blank">
            <div class="card-title">Drawfast</div>
        </a>
    </div>

    <div class="footer">
        Just a little corner of the web for you.
    </div>

    <script>
        // --- 1. The Rotating Uplifts (Selected Messages) ---
        const uplifts =[
            "Hope you're having a really good day, Sri.",
            "Remember to take a quick break and grab some water!",
            "Just a little reminder that you're doing great.",
            "Hope today brings you something to smile about.",
            "Sending some good vibes your way today.",
            "Just dropping by to say keep up the amazing work."
        ];

        const overlay = document.getElementById('toast-overlay');
        const toastHeading = document.getElementById('toast-text');

        window.onload = function() {
            if (!sessionStorage.getItem('hasSeenGreeting')) {
                const randomMessage = uplifts[Math.floor(Math.random() * uplifts.length)];
                toastHeading.textContent = randomMessage;
                overlay.style.display = 'flex';
                document.body.style.overflow = 'hidden';
            }
        };

        function closeToast() {
            overlay.style.display = 'none';
            document.body.style.overflow = 'auto';
            sessionStorage.setItem('hasSeenGreeting', 'true');
        }

        // --- 2. The "Come Back Soon?" Tab Trick ---
        let originalTitle = document.title;
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                document.title = "Come back soon? :)";
            } else {
                document.title = originalTitle;
            }
        });

        // --- 3. The Magical Theme & Petals Typing Logic ---
        let keyBuffer = '';
        const MAX_BUFFER = 30;
        const secretCode = 'silverisridurga';
        
        // Default classic pink for petals
        let currentPetalColor = '#ffb7c5'; 

        // The Massive Vibe & Color Dictionary
        const themeDict = {
            "matcha": "#c5d8a4", "mocha": "#785038", "ocean": "#006994", "barbie": "#e0218a",
            "hacker": "#00ff00", "dracula": "#800000", "ghost": "#e6e6e6", "alien": "#39ff14",
            "midnight": "#191970", "sunset": "#fd5e53", "forest": "#228b22", "chai": "#d7c0a9",
            "espresso": "#4b3621", "cherry": "#ffb7c5", "peach": "#ffcda2", "lavender": "#e6e6fa",
            "bubblegum": "#ffc1cc", "crimson": "#dc143c", "gold": "#ffd700", "silver": "#c0c0c0",
            "teal": "#008080", "indigo": "#4b0082", "violet": "#ee82ee", "pink": "#ffb7c5",
            "purple": "#800080", "blue": "#0000ff", "red": "#ff0000", "green": "#008000",
            "yellow": "#ffff00", "orange": "#ffa500", "black": "#000000", "white": "#ffffff",
            "grey": "#808080", "gray": "#808080", "cyan": "#00ffff", "magenta": "#ff00ff",
            "brown": "#a52a2a", "maroon": "#800000", "navy": "#000080", "coral": "#ff7f50",
            "plum": "#dda0dd", "salmon": "#fa8072", "tomato": "#ff6347", "turquoise": "#40e0d0"
        };
        const themeWords = Object.keys(themeDict);

        window.addEventListener('keydown', (e) => {
            // Ignore if modifier keys are pressed
            if (e.metaKey || e.ctrlKey || e.altKey) return;
            
            // Only capture letters
            if (e.key.length === 1) {
                keyBuffer += e.key.toLowerCase();
            }
            
            // Keep buffer length manageable
            if (keyBuffer.length > MAX_BUFFER) {
                keyBuffer = keyBuffer.slice(-MAX_BUFFER);
            }

            // Trigger #1: The Petal Code
            if (keyBuffer.endsWith(secretCode)) {
                triggerBlossoms();
                keyBuffer = ''; 
                return;
            }

            // Trigger #2: The Hidden Colors
            for (let word of themeWords) {
                if (keyBuffer.endsWith(word)) {
                    applyTheme(themeDict[word]);
                    keyBuffer = ''; // Reset so they can type another color seamlessly
                    break;
                }
            }
        });

        // --- 4. The Color Math & Theming Logic ---
        function hexToRgb(hex) {
            let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        function rgbToHsl(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            let max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;
            if (max == min) {
                h = s = 0; // Achromatic (greys/blacks)
            } else {
                let d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch(max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
        }

        function applyTheme(hex) {
            const rgb = hexToRgb(hex);
            if (!rgb) return;
            const hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
            
            const root = document.documentElement;
            
            // Generate a perfectly aesthetic, readable monochromatic palette dynamically
            // For background: always keep lightness very high so dark text remains readable
            root.style.setProperty('--bg-1', `hsl(${hsl.h}, ${hsl.s}%, 95%)`);
            root.style.setProperty('--bg-2', `hsl(${hsl.h}, ${hsl.s}%, 85%)`);
            root.style.setProperty('--bg-3', `hsl(${hsl.h}, ${hsl.s}%, 90%)`);
            root.style.setProperty('--bg-4', `hsl(${hsl.h}, ${hsl.s}%, 97%)`);
            
            // For text: force high saturation if color was grey, force low lightness so it stands out
            root.style.setProperty('--text-color', `hsl(${hsl.h}, ${Math.max(hsl.s, 30)}%, 20%)`);
            root.style.setProperty('--text-secondary', `hsl(${hsl.h}, ${Math.max(hsl.s, 20)}%, 40%)`);
            
            // Accents & shadows perfectly map to the requested hue
            root.style.setProperty('--accent-color', `hsl(${hsl.h}, ${hsl.s}%, 60%)`);
            root.style.setProperty('--shadow-color', `hsla(${hsl.h}, ${hsl.s}%, 60%, 0.3)`);
            
            // Update the global petal color to match the new aesthetic!
            // We use a mid-high lightness to make it look like a real leaf/petal
            currentPetalColor = `hsl(${hsl.h}, ${hsl.s}%, 75%)`;
        }

        function triggerBlossoms() {
            const container = document.getElementById('blossom-container');
            
            for(let i = 0; i < 40; i++) {
                setTimeout(() => {
                    const petal = document.createElement('div');
                    petal.classList.add('petal');
                    
                    // Chameleon petals! They now match the dynamic theme
                    petal.style.backgroundColor = currentPetalColor;
                    petal.style.boxShadow = `0 0 5px ${currentPetalColor}`;
                    
                    const size = Math.random() * 12 + 10;
                    petal.style.width = `${size}px`;
                    petal.style.height = `${size}px`;
                    petal.style.left = `${Math.random() * 100}vw`;
                    petal.style.animationDuration = `${Math.random() * 3 + 4}s`;
                    
                    container.appendChild(petal);
                    
                    setTimeout(() => {
                        petal.remove();
                    }, 8000); 

                }, i * 150);
            }
        }
    </script>
</body>
</html>
