<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 18% 0%, rgba(99, 102, 241, 0.06), transparent 42%),
        radial-gradient(circle at 85% 10%, rgba(16, 185, 129, 0.05), transparent 38%),
        #f4f6fb;
      color: #141824;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page-wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 56px 24px 80px;
    }

    /* Header */
    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 34px;
      padding-bottom: 22px;
      border-bottom: 1px solid #e3e8f2;
      flex-wrap: wrap;
    }

    .site-title {
      margin: 0;
      font-size: clamp(2rem, 4.2vw, 2.75rem);
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1.05;
      background: linear-gradient(135deg, #141824 0%, #4338ca 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: #ffffff;
      color: #0f172a;
      border: 1px solid #e2e8f0;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.22);
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.86); }
    }

    /* Bento Grid */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    @media (max-width: 680px) {
      .page-wrap {
        padding: 36px 16px 60px;
      }
      .projects-grid {
        grid-template-columns: 1fr;
        gap: 14px;
      }
    }

    /* Cards — Uniform Height */
    .project-card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 144px;
      padding: 22px 24px;
      background: #ffffff;
      border: 1px solid rgba(15, 23, 42, 0.07);
      border-radius: 22px;
      box-shadow:
        0 2px 6px rgba(15, 23, 42, 0.04),
        0 10px 24px rgba(15, 23, 42, 0.03);
      text-decoration: none;
      color: inherit;
      transition:
        transform 0.22s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.22s ease,
        border-color 0.22s ease;
    }

    .project-card:hover {
      transform: translateY(-5px) scale(1.01);
      border-color: var(--card-border);
      box-shadow: 0 14px 32px rgba(15, 23, 42, 0.09);
    }

    .project-card:active {
      transform: translateY(-1px) scale(0.995);
    }

    .project-card:focus-visible {
      outline: 2px solid var(--card-border);
      outline-offset: 3px;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 24px;
    }

    .card-top-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex-wrap: wrap;
    }

    .card-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 28px;
      padding: 0 11px;
      background: var(--card-soft);
      color: var(--card-num-ink);
      border-radius: 999px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.76rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .card-arrow {
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
      color: #475569;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      flex-shrink: 0;
      transition:
        transform 0.22s cubic-bezier(0.22, 1, 0.36, 1),
        background 0.2s ease,
        color 0.2s ease;
    }

    .project-card:hover .card-arrow {
      background: var(--card-accent);
      color: var(--card-arrow-ink);
      transform: translate(2px, -2px) rotate(6deg);
    }

    .card-title {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #141824;
    }

    /* Compact Inline Countdown Pill */
    .countdown-pill {
      display: inline-flex;
      flex-direction: column;
      justify-content: center;
      min-height: 36px;
      padding: 4px 11px;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 11px;
      font-family: 'JetBrains Mono', monospace;
      line-height: 1.2;
    }

    .countdown-pill.is-offline {
      background: #fef2f2;
      border-color: #fecaca;
    }

    .countdown-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #b45309;
    }

    .countdown-pill.is-offline .countdown-label {
      color: #b91c1c;
    }

    .countdown-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #f59e0b;
      flex-shrink: 0;
      animation: pulse-dot 1.2s infinite;
    }

    .countdown-pill.is-offline .countdown-dot {
      background: #ef4444;
      animation: none;
    }

    .countdown-time {
      font-size: 0.72rem;
      font-weight: 700;
      color: #78350f;
      white-space: nowrap;
    }

    .countdown-pill.is-offline .countdown-time {
      color: #991b1b;
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <header class="site-header">
      <h1 class="site-title">Projects</h1>
      <div class="live-badge">
        <span class="live-dot"></span>
        <span id="liveCount">-- LIVE</span>
      </div>
    </header>

    <main class="projects-grid" id="projectsGrid"></main>
  </div>

  <script src="projects.js"></script>
  <script>
    const projects = Array.isArray(window.projectsData) ? window.projectsData : [];

    function pad2(n) {
      return String(n).padStart(2, '0');
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function isLightColor(hex) {
      const clean = (hex || '').replace('#', '').trim();
      if (clean.length !== 3 && clean.length !== 6) return false;
      const full = clean.length === 3
        ? clean.split('').map((c) => c + c).join('')
        : clean;
      const r = parseInt(full.slice(0, 2), 16);
      const g = parseInt(full.slice(2, 4), 16);
      const b = parseInt(full.slice(4, 6), 16);
      return (r * 299 + g * 587 + b * 114) / 1000 > 160;
    }

    function getCardThemeStyle(accent) {
      const color = accent || '#6366f1';
      if (isLightColor(color)) {
        return [
          `--card-accent:${color}`,
          `--card-soft:color-mix(in srgb, ${color} 40%, #ffffff)`,
          `--card-num-ink:color-mix(in srgb, ${color} 32%, #141824)`,
          `--card-border:color-mix(in srgb, ${color} 85%, #141824)`,
          `--card-arrow-ink:#141824`,
        ].join('; ');
      }
      return [
        `--card-accent:${color}`,
        `--card-soft:color-mix(in srgb, ${color} 12%, #ffffff)`,
        `--card-num-ink:${color}`,
        `--card-border:${color}`,
        `--card-arrow-ink:#ffffff`,
      ].join('; ');
    }

    function formatCountdown(ms) {
      const totalSec = Math.max(0, Math.floor(ms / 1000));
      const days = Math.floor(totalSec / 86400);
      const hrs = pad2(Math.floor((totalSec % 86400) / 3600));
      const mins = pad2(Math.floor((totalSec % 3600) / 60));
      const secs = pad2(totalSec % 60);
      return `${days}d : ${hrs}h : ${mins}m : ${secs}s`;
    }

    function renderGrid() {
      const grid = document.getElementById('projectsGrid');
      grid.innerHTML = projects.map((project, index) => {
        const num = pad2(index + 1);
        const title = escapeHtml(project.title);
        const upperTitle = escapeHtml((project.title || '').toUpperCase());
        const url = escapeHtml(project.url);
        const styleAttr = escapeHtml(getCardThemeStyle(project.accent));

        const countdownMarkup = project.expiresAt
          ? `
            <span
              class="countdown-pill"
              data-expires-at="${escapeHtml(project.expiresAt)}"
              data-project-name="${upperTitle}"
            >
              <span class="countdown-label">
                <span class="countdown-dot"></span>
                <span class="countdown-label-text">${upperTitle} GOES DOWN IN</span>
              </span>
              <span class="countdown-time">--</span>
            </span>
          `
          : '';

        return `
          <a
            class="project-card"
            href="${url}"
            target="_blank"
            rel="noopener noreferrer"
            style="${styleAttr}"
          >
            <div class="card-top">
              <div class="card-top-left">
                <span class="card-num">${num}</span>
                ${countdownMarkup}
              </div>
              <span class="card-arrow" aria-hidden="true">↗</span>
            </div>
            <h2 class="card-title">${title}</h2>
          </a>
        `;
      }).join('');
    }

    function updateCountdowns() {
      const pills = document.querySelectorAll('.countdown-pill[data-expires-at]');
      let offlineCount = 0;

      pills.forEach((pill) => {
        const targetMs = new Date(pill.dataset.expiresAt).getTime();
        const remaining = targetMs - Date.now();
        const label = pill.querySelector('.countdown-label-text');
        const timer = pill.querySelector('.countdown-time');
        const name = pill.dataset.projectName;

        if (remaining <= 0) {
          offlineCount++;
          pill.classList.add('is-offline');
          label.textContent = 'STATUS';
          timer.textContent = `${name} OFFLINE`;
        } else {
          pill.classList.remove('is-offline');
          label.textContent = `${name} GOES DOWN IN`;
          timer.textContent = formatCountdown(remaining);
        }
      });

      const liveBadge = document.getElementById('liveCount');
      if (liveBadge) {
        liveBadge.textContent = `${pad2(projects.length - offlineCount)} LIVE`;
      }
    }

    renderGrid();
    updateCountdowns();
    setInterval(updateCountdowns, 1000);
  </script>
</body>
</html>
