<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sridurga | Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #e3f2fd;
            --card-bg: #ffffff;
            --text-color: #1565c0;
            --text-secondary: #555555;
            --accent-color: #2196f3;
            --shadow-color: rgba(33, 150, 243, 0.15);
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh; 
        }
        h1 {
            font-family: 'IM Fell English', serif; 
            font-weight: 400;
            font-size: 3.5rem;
            margin-bottom: 40px;
            text-align: center;
            color: var(--text-color);
            text-shadow: 2px 2px 0px rgba(174, 213, 243, 0.5);
        }
        .project-grid {
            display: grid;
            width: 100%;
            max-width: 800px;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none; 
            color: var(--text-secondary);
            box-shadow: 0 4px 15px var(--shadow-color);
            border: 1px solid transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(33, 150, 243, 0.3);
            border-color: var(--accent-color);
        }
        .card-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-color);
        }
        .footer {
            margin-top: auto;
            padding: 20px;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .footer a { color: var(--accent-color); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Sri's Stuff</h1>

    <div class="project-grid">
        <a href="https://geogle.storm-fyre.workers.dev/" class="card" target="_blank">
            <div class="card-title">Geogle</div>
        </a>
        <a href="https://storm-fyre.github.io/silversolver/" class="card" target="_blank">
            <div class="card-title">Silver Solver</div>
        </a>
    </div>

    <div class="footer">
        Contact: <a href="mailto:rakshann.t@gmail.com">rakshann.t@gmail.com</a>
    </div>

</body>
</html>
