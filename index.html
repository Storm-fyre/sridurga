<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sridurga | Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap" rel="stylesheet">
    <style>
        :root {
            --text-color: #5c3a4d; /* Soft, deep mauve for high readability and warmth */
            --text-secondary: #7a5c6b;
            --accent-color: #f08a9d; /* Warm rose gold/pink */
            --card-bg: rgba(255, 255, 255, 0.65); /* Glass effect */
            --shadow-color: rgba(240, 138, 157, 0.2);
        }

        /* --- Living Sunset Background --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box; /* Fixes the cut-off issue */
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
            background: linear-gradient(-45deg, #fce4ec, #f8bbd0, #ffeff1, #fff3e0);
            background-size: 400% 400%;
            animation: breathe 15s ease infinite;
            overflow-x: hidden;
        }

        @keyframes breathe {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- Toast / Modal Styles --- */
        #toast-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(252, 228, 236, 0.3);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
            box-sizing: border-box;
        }

        .toast-card {
            background: rgba(255, 255, 255, 0.85);
            width: 100%;
            max-width: 500px;
            padding: 60px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(240, 138, 157, 0.3);
            position: relative;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-sizing: border-box;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast-card h2 {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 1.8rem;
            font-weight: 600;
            margin: 0;
            color: var(--text-color);
            letter-spacing: -0.5px;
            line-height: 1.4;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 32px;
            font-weight: 300;
            cursor: pointer;
            color: #bfa5b1;
            line-height: 1;
            transition: color 0.2s, transform 0.2s;
            user-select: none;
        }

        .close-btn:hover {
            color: var(--accent-color);
            transform: scale(1.1);
        }

        @media (max-width: 480px) {
            .toast-card h2 { font-size: 1.5rem; }
            .toast-card { padding: 50px 25px; }
        }

        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* --- Main Content --- */
        h1 {
            font-family: 'IM Fell English', serif;
            font-weight: 400;
            font-size: 3.5rem;
            margin-bottom: 40px;
            text-align: center;
            color: var(--text-color);
            text-shadow: 2px 2px 0px rgba(255, 255, 255, 0.6);
            position: relative;
            z-index: 10;
        }

        .project-grid {
            display: grid;
            width: 100%;
            max-width: 800px;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            position: relative;
            z-index: 10;
        }

        .card {
            background-color: var(--card-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.4s ease, box-shadow 0.4s ease, border-color 0.4s ease;
            text-decoration: none;
            color: var(--text-secondary);
            box-shadow: 0 8px 20px var(--shadow-color);
            border: 1px solid rgba(255, 255, 255, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px 20px;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(240, 138, 157, 0.4);
            border-color: var(--accent-color);
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-color);
        }

        .footer {
            margin-top: auto;
            padding: 30px 20px 25px; /* Added extra bottom padding to lift it clearly above the edge */
            text-align: center;
            font-size: 1rem;
            color: var(--text-secondary);
            font-style: italic;
            position: relative;
            z-index: 10;
        }

        /* --- Cherry Blossom Secret Styles --- */
        #blossom-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            top: -10%;
            background-color: #ffb7c5; /* Classic cherry blossom pink */
            border-radius: 15px 0 15px 0;
            opacity: 0.8;
            box-shadow: 0 0 5px rgba(255, 183, 197, 0.5);
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg) translateX(0); }
            100% { transform: translateY(110vh) rotate(720deg) translateX(50px); }
        }
    </style>
</head>
<body>

    <!-- Toast Component -->
    <div id="toast-overlay">
        <div class="toast-card">
            <span class="close-btn" onclick="closeToast()">&times;</span>
            <h2 id="toast-text">Loading...</h2>
        </div>
    </div>

    <!-- Container for secret cherry blossoms -->
    <div id="blossom-container"></div>

    <h1>Sri's Stuff</h1>

    <div class="project-grid">
        <a href="https://geogle.storm-fyre.workers.dev/" class="card" target="_blank">
            <div class="card-title">Geogle</div>
        </a>
        <a href="https://storm-fyre.github.io/silversolver/" class="card" target="_blank">
            <div class="card-title">Silver Solver</div>
        </a>
        <a href="https://storm-fyre.github.io/export-tradle/" class="card" target="_blank">
            <div class="card-title">Stromfyre's Tradle</div>
        </a>
    </div>

    <div class="footer">
        Just a little corner of the web for you.
    </div>

    <script>
        // --- 1. The Rotating Uplifts ---
        const uplifts =[
            "Hope you're having a beautiful day, Sri.",
            "Remember to take a break and hydrate!",
            "Just a little reminder that you're doing great.",
            "Your projects are looking amazing as always.",
            "Wishing you a day as wonderful as you are."
        ];

        const overlay = document.getElementById('toast-overlay');
        const toastHeading = document.getElementById('toast-text');

        window.onload = function() {
            // Use sessionStorage so it only greets her once per browsing session 
            // instead of every single time she refreshes the page.
            if (!sessionStorage.getItem('hasSeenGreeting')) {
                const randomMessage = uplifts[Math.floor(Math.random() * uplifts.length)];
                toastHeading.textContent = randomMessage;
                overlay.style.display = 'flex';
                document.body.style.overflow = 'hidden';
            }
        };

        function closeToast() {
            overlay.style.display = 'none';
            document.body.style.overflow = 'auto';
            sessionStorage.setItem('hasSeenGreeting', 'true');
        }

        // --- 2. The "Come Back Soon?" Tab Trick ---
        let originalTitle = document.title;
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                document.title = "Come back soon? :)";
            } else {
                document.title = originalTitle;
            }
        });

        // --- 3. The Secret Cherry Blossom Code ---
        let keysPressed = '';
        const secretCode = 'silverisridurga';

        window.addEventListener('keydown', (e) => {
            // Add the key to our tracker
            keysPressed += e.key.toLowerCase();
            
            // Keep the tracker string the exact same length as our secret code
            if (keysPressed.length > secretCode.length) {
                keysPressed = keysPressed.slice(-secretCode.length);
            }

            // If it matches, trigger the magic!
            if (keysPressed === secretCode) {
                triggerBlossoms();
                keysPressed = ''; // Reset so she can do it again if she wants
            }
        });

        function triggerBlossoms() {
            const container = document.getElementById('blossom-container');
            
            // Create 40 petals with slight delays so they don't fall all at once
            for(let i = 0; i < 40; i++) {
                setTimeout(() => {
                    const petal = document.createElement('div');
                    petal.classList.add('petal');
                    
                    // Randomize size, starting position, and fall speed
                    const size = Math.random() * 12 + 10; // Between 10px and 22px
                    petal.style.width = `${size}px`;
                    petal.style.height = `${size}px`;
                    petal.style.left = `${Math.random() * 100}vw`;
                    petal.style.animationDuration = `${Math.random() * 3 + 4}s`; // Between 4s and 7s
                    
                    container.appendChild(petal);
                    
                    // Clean up the petal from the DOM after it finishes falling
                    setTimeout(() => {
                        petal.remove();
                    }, 8000); 

                }, i * 150); // Stagger the spawn times
            }
        }
    </script>

</body>
</html>
